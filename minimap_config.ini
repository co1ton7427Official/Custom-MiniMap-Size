; ===========================================================================
;  minimap.asi  -  minimap_config.ini
;  GTA:San Andreas 雷达（小地图）位置 / 大小 / 形状 修改插件
;  作者：Colton
;  This file must sit next to minimap.asi, i.e. in the GTA:San Andreas folder.
;  Encoding: ANSI, or UTF-8 without BOM.  Comments start with ';'.
;  编码：ANSI 或"无 BOM 的 UTF-8"；行内注释用 ';'；键名不区分大小写。
; ===========================================================================

[minimap]

; --- master switch ---------------------------------------------------------
; 0 = the plugin loads but patches nothing, 1 = the radar follows this file.
; 总开关：1 = 生效，0 = 插件只加载、什么都不改。
; 注意：Enable 只在游戏启动时读一次 —— 写成 0 时连"热重载"线程都不会启动，
;       想改回 1 必须重启游戏。
Enable = 1

; --- position and size -----------------------------------------------------
; Units decides what X / Y / Width / Height mean:
;   PIXELS  -> literal pixels of your current resolution
;   STRETCH -> 640x448 reference units, scaled by the game exactly like the
;              vanilla HUD does (X and Y scale independently, which keeps the
;              proportions the game itself uses on widescreen monitors)
; 单位：PIXELS = 当前分辨率的真实像素；STRETCH = 640x448 参考单位（游戏原版
;       就是按这个缩放，X、Y 各自独立缩放）。换分辨率后 STRETCH 不用改。
Units = STRETCH

; Which corner of the radar rectangle X / Y are measured from:
;   TOPLEFT / TOPRIGHT / BOTTOMLEFT / BOTTOMRIGHT
; 锚点：X/Y 从屏幕的哪个角开始量。默认 BOTTOMLEFT（左下角，和原版一致）。
Anchor = BOTTOMLEFT

; Distance from the screen edges, in the unit space chosen above.
; The STRETCH defaults reproduce the vanilla radar exactly:
; 40 px from the left edge, 28 px from the bottom, in 640x448 space.
; X / Y = 雷达矩形离锚点那条边的距离（默认：离左边 40、离下边 28）。
; STRETCH 模式下这两个默认值 = 原版雷达位置，逐像素一致。
X = 40
Y = 28

; Size of the radar rectangle.
; 雷达矩形的宽高。默认 94 x 76 = 原版大小。
Width  = 94
Height = 76

; --- shape -----------------------------------------------------------------
; 1 = square/rectangular radar, 0 = the vanilla round one.
;
; With 1 the plugin collapses the quarter-circle fans in CRadar::DrawRadarMask
; (nothing is clipped to a circle any more) and swaps CRadar::LimitRadarPoint
; for a square clamp, so blips reach the corners instead of stopping on the
; inscribed circle. Height is then forced to equal Width, which is what makes
; it a square rather than a rectangle.
;
; 形状：1 = 方形/矩形雷达（去掉圆形遮罩），0 = 原版圆形。
; 设为 1 时 Height 会被忽略，插件强制 Height = Width（按像素计算），
; 所以在 16:9 屏幕上也能得到真正的正方形。想画矩形请用 0。
ForceSquare = 0

; The vanilla round HUD_RADARDISC art is drawn by CHud::DrawRadar from its own
; hard-coded rectangle - it does NOT follow the radar. So as soon as the radar
; is moved, resized or squared, the original ring would be left behind at the
; OLD position, drawn over the map. Whenever your rectangle differs from the
; vanilla one (and always in square mode) those draws are made transparent.
; Set to 1 to keep the round art anyway, e.g. if you only nudged the radar by a
; couple of pixels and want the ring to stay.
;
; 圆形底图：原版那圈白边由 CHud::DrawRadar 用自己写死的矩形画，不跟着雷达走。
; 所以只要雷达被移动/缩放/变方，默认就会把这几个 sprite 画成全透明，
; 避免"旧位置上多出一个圆环"。设 1 可强行保留（例如你只挪了几个像素）。
KeepRadarDisc = 0

; --- quality of life -------------------------------------------------------
; 1 = re-read this file while the game runs (position/size take effect on the
; next frame, the shape patches immediately). 0 = read once at load time.
; 热重载：1 = 游戏运行中改本文件立即生效（位置/大小下一帧生效，形状立即生效），
;         0 = 只在启动时读一次。
HotReload = 1

; Every address this plugin uses belongs to gta_sa.exe 1.0 US (Hoodlum),
; 14,383,616 bytes. Other builds are refused because patching the wrong
; addresses crashes the game. Set to 1 to skip the check anyway - only do that
; if you are certain your executable is address-compatible.
; 版本检查：只认 gta_sa.exe 1.0 US（Hoodlum，14,383,616 字节）。
; 别的版本地址不同，插件会拒绝改动（不是崩溃，是拒绝干活）。
; 只有在你确定自己的 exe 地址兼容时才设成 1。
IgnoreVersionCheck = 0
